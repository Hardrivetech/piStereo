<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="186mm" height="106mm" viewBox="0 0 186 106" version="1.1">
  <!-- Outer bezel -->
  <rect x="0.5" y="0.5" width="185" height="105" fill="none" stroke="#000" stroke-width="1" />
  <!-- Double-DIN opening (180 x 100 mm) centered with 3 mm flange -->
  <rect x="3" y="3" width="180" height="100" fill="none" stroke="#000" stroke-width="0.5" stroke-dasharray="4 2" />

  <!-- Volume encoder hole (6 mm shaft, drill 6.5 mm) -->
  <circle cx="20" cy="53" r="3.25" fill="none" stroke="#000" stroke-width="0.5" />
  <text x="20" y="45" font-size="4.5" text-anchor="middle">VOL</text>

  <!-- Power button (8 mm) -->
  <circle cx="12" cy="12" r="4" fill="none" stroke="#000" stroke-width="0.5" />
  <text x="12" y="7.5" font-size="3.5" text-anchor="middle">PWR</text>

  <!-- Prev / Play / Next buttons (12 mm) -->
  <circle cx="68" cy="85" r="6" fill="none" stroke="#000" stroke-width="0.5" />
  <circle cx="93" cy="85" r="6" fill="none" stroke="#000" stroke-width="0.5" />
  <circle cx="118" cy="85" r="6" fill="none" stroke="#000" stroke-width="0.5" />
  <text x="68" y="91" font-size="3.5" text-anchor="middle">Prev</text>
  <text x="93" y="91" font-size="3.5" text-anchor="middle">Play</text>
  <text x="118" y="91" font-size="3.5" text-anchor="middle">Next</text>

  <!-- Notes / measurements -->
  <text x="93" y="15" font-size="3.5" text-anchor="middle">Double-DIN opening 180×100 mm (dashed)</text>
  <text x="93" y="100" font-size="3" text-anchor="middle">Print at 100% scale — units in mm</text>
</svg>
